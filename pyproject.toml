[build-system]
requires = [
    "setuptools>=77",
    "wheel>=0.45",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyisogen"
dynamic = ["version"]
description = "Fast isotope-distribution calculations for proteins, nucleic acids, and elemental formulas"
readme = "README.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/fftw/COPYING",
    "src/fftw/COPYRIGHT",
]
authors = [
    { name = "Michael T. Marty", email = "mtmarty@utexas.edu" },
]
keywords = [
    "isotope distribution",
    "mass spectrometry",
    "proteomics",
    "protein",
    "DNA",
    "RNA",
    "elemental formula",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pyteomics>=4.7",
]
docs = [
    "mkdocs>=1.6",
]
training = [
    "pandas>=2.3",
    "torch>=2.7",
]
release = [
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
isogen = "isogen.__main__:main"

[project.urls]
Homepage = "https://github.com/michaelmarty/IsoGen"
Repository = "https://github.com/michaelmarty/IsoGen"
Issues = "https://github.com/michaelmarty/IsoGen/issues"
Documentation = "https://michaelmarty.github.io/IsoGen/"

[tool.setuptools]
packages = ["isogen"]
include-package-data = false

[tool.setuptools.package-data]
isogen = [
    "models/*.bin",
    "models/*.pth",
]

[tool.setuptools.dynamic]
version = { attr = "isogen._version.__version__" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
