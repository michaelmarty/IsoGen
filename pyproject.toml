[build-system]
requires = [
    "scikit-build-core>=0.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyisogen"
version = "1.0.4"
description = "Fast isotope-distribution calculations for proteins, nucleic acids, and elemental formulas"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/fftw/COPYING",
    "src/fftw/COPYRIGHT",
]
authors = [
    { name = "Michael T. Marty", email = "mtmarty@utexas.edu" },
]
keywords = [
    "isotope distribution",
    "mass spectrometry",
    "proteomics",
    "protein",
    "DNA",
    "RNA",
    "elemental formula",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pyteomics>=4.7",
]
docs = [
    "mkdocs>=1.6",
]
training = [
    "pandas>=2.3",
    "torch>=2.7",
]
release = [
    "build>=1.2",
    "twine>=5",
]

[project.scripts]
isogen = "isogen.__main__:main"

[project.urls]
Homepage = "https://github.com/michaelmarty/IsoGen"
Repository = "https://github.com/michaelmarty/IsoGen"
Issues = "https://github.com/michaelmarty/IsoGen/issues"
Documentation = "https://michaelmarty.github.io/IsoGen/"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "src"
cmake.version = ">=3.22.1"
wheel.packages = ["isogen"]
wheel.install-dir = "isogen/bin"
wheel.py-api = "py3"
install.components = ["Runtime"]
sdist.include = [
    "src/**",
    "isogen/**",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
sdist.exclude = [
    "bin/**",
    "setup.py",
]
messages.after-failure = """
IsoGen's native library could not be compiled.
Install a C/C++ compiler, CMake, and the FFTW development libraries,
or install a prebuilt wheel for your operating system.
"""

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
