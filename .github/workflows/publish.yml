name: Build and publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Also publish the release artifacts to PyPI?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ONEAPI_WINDOWS_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/bae85ab1-cfcd-4251-8d42-a0c27949ea33/intel-oneapi-toolkit-2026.0.0.193_offline.exe
  ONEAPI_WINDOWS_VERSION: 2026.0.0.193
  ONEAPI_WINDOWS_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common
  ONEAPI_WINDOWS_CACHE_VERSION: 1

jobs:
  release-metadata:
    name: Read release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Read and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' isogen/_version.py)"
          if [[ -z "$version" ]]; then
            echo "Could not read __version__ from isogen/_version.py" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "$EVENT_NAME" == "release" && "$PUBLISHED_TAG" != "$tag" ]]; then
            echo "Release tag '$PUBLISHED_TAG' does not match '$tag' from isogen/_version.py" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  wheels-windows:
    name: Build Windows wheels (MSVC and Intel)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'dist-msvc', 'dist-intel', 'wheelhouse')]"

      - name: Build MSVC comparison wheel
        run: python -m build --wheel --outdir dist-msvc

      - name: Cache Intel oneAPI compiler
        id: cache-oneapi
        uses: actions/cache@v5
        with:
          path: |
            C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat
            C:\Program Files (x86)\Intel\oneAPI\compiler
          key: oneapi-windows-cpp-${{ env.ONEAPI_WINDOWS_CACHE_VERSION }}-${{ env.ONEAPI_WINDOWS_VERSION }}-${{ env.ONEAPI_WINDOWS_COMPONENTS }}

      - name: Install Intel oneAPI compiler
        if: steps.cache-oneapi.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl.exe --fail --location --retry 5 --retry-delay 5 --output "%RUNNER_TEMP%\oneapi-installer.exe" "%ONEAPI_WINDOWS_URL%"
          start /b /wait "" "%RUNNER_TEMP%\oneapi-installer.exe" -s -x -f "%RUNNER_TEMP%\oneapi-extracted" --log extract.log
          "%RUNNER_TEMP%\oneapi-extracted\bootstrapper.exe" -s --action install --components=%ONEAPI_WINDOWS_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=.

      - name: Build Intel oneAPI wheel
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat" vs2022
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\env\vars.bat"
          set "CC=icx-cl"
          set "CXX=icx-cl"
          set "CMAKE_GENERATOR=Ninja"
          set "CMAKE_ARGS=-DISOGEN_REQUIRE_INTELLLVM=ON"
          where icx-cl
          icx-cl --version
          python -m build --wheel --outdir dist-intel

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Windows
          path: dist-intel/*.whl
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: comparison-wheel-Windows-MSVC
          path: dist-msvc/*.whl
          if-no-files-found: error

  compare-windows-compilers:
    name: Test and compare Windows wheels
    needs: wheels-windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: wheel-Windows
          path: wheels/intel

      - uses: actions/download-artifact@v8
        with:
          name: comparison-wheel-Windows-MSVC
          path: wheels/msvc

      - name: Test MSVC wheel
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "${{ runner.temp }}\msvc-test"
          $python = "${{ runner.temp }}\msvc-test\Scripts\python.exe"
          $wheel = (Get-ChildItem '${{ github.workspace }}\wheels\msvc\*.whl').FullName
          & $python -m pip install $wheel "pytest>=8" "pyteomics>=4.7"
          & $python -m pytest '${{ github.workspace }}\tests' --import-mode=importlib
          & $python '${{ github.workspace }}\benchmarks\wheel_performance.py' --label MSVC --output '${{ github.workspace }}\performance\msvc.json'

      - name: Test Intel wheel without oneAPI installed
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "${{ runner.temp }}\intel-test"
          $python = "${{ runner.temp }}\intel-test\Scripts\python.exe"
          $wheel = (Get-ChildItem '${{ github.workspace }}\wheels\intel\*.whl').FullName
          & $python -m pip install $wheel "pytest>=8" "pyteomics>=4.7"
          & $python -m pytest '${{ github.workspace }}\tests' --import-mode=importlib
          & $python '${{ github.workspace }}\benchmarks\wheel_performance.py' --label Intel --output '${{ github.workspace }}\performance\intel.json'

      - name: Compare compiler performance and numerical results
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $python = "${{ runner.temp }}\msvc-test\Scripts\python.exe"
          & $python '${{ github.workspace }}\benchmarks\compare_performance.py' `
            --msvc '${{ github.workspace }}\performance\msvc.json' `
            --intel '${{ github.workspace }}\performance\intel.json' `
            --output '${{ github.workspace }}\performance\comparison.json' `
            --summary $env:GITHUB_STEP_SUMMARY `
            --maximum-slowdown 1.10

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-Windows-compilers
          path: performance/*.json
          if-no-files-found: warn

  wheels-linux:
    name: Build Linux wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"

      - name: Install Linux native dependency
        run: sudo apt-get update && sudo apt-get install --yes libfftw3-double3

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair Linux wheel with auditwheel
        shell: bash
        run: |
          python -m pip install auditwheel patchelf
          mkdir wheelhouse
          auditwheel repair dist/*.whl --wheel-dir wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Test Linux wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install "${{ github.workspace }}"/dist/*.whl
          wheel-test/bin/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/bin/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Linux
          path: dist/*.whl
          if-no-files-found: error

  wheels-macos:
    name: Build macOS wheel (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install macOS native dependency
        run: brew install fftw

      - name: Install build tools
        run: python -m pip install --upgrade build delocate

      - name: Build wheel
        run: python -m build --wheel

      - name: Bundle FFTW into macOS wheel
        run: |
          mkdir wheelhouse
          delocate-wheel --require-archs "${{ matrix.arch }}" -w wheelhouse -v dist/*.whl
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Test macOS wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install "${{ github.workspace }}"/dist/*.whl
          wheel-test/bin/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/bin/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macOS-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build twine
      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"
      - run: python -m build --sdist
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: [release-metadata, wheels-windows, compare-windows-compilers, wheels-linux, wheels-macos, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist

      - name: Publish release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

  publish:
    name: Publish to PyPI
    if: >-
      always() &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')) &&
      (github.event_name == 'release' || needs.github-release.result == 'success') &&
      needs.release-metadata.result == 'success' &&
      needs.wheels-windows.result == 'success' &&
      needs.compare-windows-compilers.result == 'success' &&
      needs.wheels-linux.result == 'success' &&
      needs.wheels-macos.result == 'success' &&
      needs.sdist.result == 'success'
    needs: [release-metadata, wheels-windows, compare-windows-compilers, wheels-linux, wheels-macos, sdist, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyisogen
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
