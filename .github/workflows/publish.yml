name: Build and publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Also publish the release artifacts to PyPI?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Read release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - name: Read and validate version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' isogen/_version.py)"
          if [[ -z "$version" ]]; then
            echo "Could not read __version__ from isogen/_version.py" >&2
            exit 1
          fi

          tag="v$version"
          if [[ "$EVENT_NAME" == "release" && "$PUBLISHED_TAG" != "$tag" ]]; then
            echo "Release tag '$PUBLISHED_TAG' does not match '$tag' from isogen/_version.py" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  wheels-windows:
    name: Build Windows wheel
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Test Windows wheel
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          $wheel = (Get-ChildItem '${{ github.workspace }}\dist\*.whl').FullName
          wheel-test/Scripts/python -m pip install $wheel
          wheel-test/Scripts/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/Scripts/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Windows
          path: dist/*.whl
          if-no-files-found: error

  wheels-linux:
    name: Build Linux wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"

      - name: Install Linux native dependency
        run: sudo apt-get update && sudo apt-get install --yes libfftw3-double3

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair Linux wheel with auditwheel
        shell: bash
        run: |
          python -m pip install auditwheel patchelf
          mkdir wheelhouse
          auditwheel repair dist/*.whl --wheel-dir wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Test Linux wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install "${{ github.workspace }}"/dist/*.whl
          wheel-test/bin/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/bin/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Linux
          path: dist/*.whl
          if-no-files-found: error

  wheels-macos:
    name: Build macOS wheel (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install macOS native dependency
        run: brew install fftw

      - name: Install build tools
        run: python -m pip install --upgrade build delocate

      - name: Build wheel
        run: python -m build --wheel

      - name: Bundle FFTW into macOS wheel
        run: |
          mkdir wheelhouse
          delocate-wheel --require-archs "${{ matrix.arch }}" -w wheelhouse -v dist/*.whl
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Test macOS wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install "${{ github.workspace }}"/dist/*.whl
          wheel-test/bin/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/bin/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macOS-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build twine
      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"
      - run: python -m build --sdist
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: github.event_name == 'workflow_dispatch'
    needs: [release-metadata, wheels-windows, wheels-linux, wheels-macos, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Publish release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

  publish:
    name: Publish to PyPI
    if: >-
      always() &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')) &&
      (github.event_name == 'release' || needs.github-release.result == 'success') &&
      needs.release-metadata.result == 'success' &&
      needs.wheels-windows.result == 'success' &&
      needs.wheels-linux.result == 'success' &&
      needs.wheels-macos.result == 'success' &&
      needs.sdist.result == 'success'
    needs: [release-metadata, wheels-windows, wheels-linux, wheels-macos, sdist, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyisogen
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
