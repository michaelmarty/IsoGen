name: Build and publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI after building?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"

      - name: Install Linux native dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfftw3-double3

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install auditwheel patchelf
          mkdir wheelhouse
          auditwheel repair dist/*.whl --wheel-dir wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Test Windows wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv wheel-test
          $wheel = (Get-ChildItem dist/*.whl).FullName
          wheel-test/Scripts/python -m pip install $wheel
          wheel-test/Scripts/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/Scripts/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - name: Test Linux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/bin/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ runner.os }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build twine
      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"
      - run: python -m build --sdist
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isogen
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
