name: Build and publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: 'Publish to PyPI after building?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels-windows:
    name: Build Windows wheel
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"

      - name: Build wheel
        run: python -m build --wheel

      - name: Test Windows wheel
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          $wheel = (Get-ChildItem '${{ github.workspace }}\dist\*.whl').FullName
          wheel-test/Scripts/python -m pip install $wheel
          wheel-test/Scripts/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/Scripts/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Windows
          path: dist/*.whl
          if-no-files-found: error

  wheels-linux:
    name: Build Linux wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"

      - name: Install Linux native dependency
        run: sudo apt-get update && sudo apt-get install --yes libfftw3-double3

      - name: Build wheel
        run: python -m build --wheel

      - name: Repair Linux wheel with auditwheel
        shell: bash
        run: |
          python -m pip install auditwheel patchelf
          mkdir wheelhouse
          auditwheel repair dist/*.whl --wheel-dir wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Test Linux wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install "${{ github.workspace }}"/dist/*.whl
          wheel-test/bin/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/bin/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Linux
          path: dist/*.whl
          if-no-files-found: error

  wheels-macos:
    name: Build macOS wheel (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install macOS native dependency
        run: brew install fftw

      - name: Install build tools
        run: python -m pip install --upgrade build delocate

      - name: Build wheel
        run: python -m build --wheel

      - name: Bundle FFTW into macOS wheel
        run: |
          mkdir wheelhouse
          delocate-wheel --require-archs "${{ matrix.arch }}" -w wheelhouse -v dist/*.whl
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Test macOS wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install "${{ github.workspace }}"/dist/*.whl
          wheel-test/bin/python -c "import isogen; assert isogen.isodist(1000, isolen=8).shape == (8, 2)"
          wheel-test/bin/python -c "import isogen; assert isogen.isodist('C6H12O6', type='ATOM', isolen=8).shape == (8, 2)"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macOS-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade build twine
      - name: Clean previous build output
        run: python -c "import shutil; [shutil.rmtree(path, ignore_errors=True) for path in ('build', 'dist', 'wheelhouse')]"
      - run: python -m build --sdist
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_pypi == 'true')
    needs: [wheels-windows, wheels-linux, wheels-macos, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyisogen
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
