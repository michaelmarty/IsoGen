name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Linux native dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfftw3-double3

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Verify portable Linux runtime linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if readelf --dynamic bin/isogen.so | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "bin/isogen.so must not depend on the build host's GNU runtime libraries"
            exit 1
          fi
          if readelf --version-info bin/isogen.so | grep -q GLIBCXX_; then
            echo "bin/isogen.so must not require versioned GLIBCXX symbols"
            exit 1
          fi

      - name: Run unit tests
        run: python -m pytest
