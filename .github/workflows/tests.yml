name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-14
          - macos-15-intel
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux native dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfftw3-double3

      - name: Install macOS native dependency
        if: runner.os == 'macOS'
        run: brew install fftw

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Verify portable Linux runtime linkage
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          native_library="$(python -c 'from isogen.isogenwrapper import dllpath; print(dllpath)')"
          if readelf --dynamic "$native_library" | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "$native_library must not depend on the build host's GNU runtime libraries"
            exit 1
          fi
          if readelf --version-info "$native_library" | grep -q GLIBCXX_; then
            echo "$native_library must not require versioned GLIBCXX symbols"
            exit 1
          fi

      - name: Run unit tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest "${{ github.workspace }}/tests" --import-mode=importlib
